# Builds the SPA image in CI and publishes it to GHCR.
#
# Unlike the Docker Hub workflow, the build happens entirely inside Docker --
# no `npm run build` on the runner beforehand. The Dockerfile does it now.
#
# Runs alongside the existing Docker Hub workflow rather than replacing it.

name: Publish image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Build (but do not publish) on PRs, so a branch is proven to build in CI
  # before it is merged. workflow_dispatch cannot cover this: it only offers
  # workflows that already exist on the default branch.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: jaya-devicesnet-fe

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Nothing is published from a pull request.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
          build-args: |
            VITE_APP_API_URL=/api/

      - name: Verify the bundle and image
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:sha-${{ github.sha }}"
          docker pull -q "$image"

          # Vite inlines VITE_APP_API_URL at build time, so a wrong or missing
          # value cannot be corrected at runtime -- it has to be caught here.
          if ! docker run --rm --entrypoint sh "$image" -c \
                 'grep -rq "\"/api/\"" /app/assets/*.js'; then
            echo "::error::VITE_APP_API_URL was not baked into the bundle as /api/"
            exit 1
          fi

          # nginx.conf replaces the whole config; a syntax error would only
          # surface as a crash-looping container on the host.
          docker run --rm "$image" nginx -t

          if docker run --rm --entrypoint sh "$image" -c \
               'ls -a / /app 2>/dev/null | grep -qE "^\.env"'; then
            echo "::error::a .env file is present in $image"
            exit 1
          fi
          echo "bundle, nginx config and image contents all check out"
