user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml image/svg+xml;

  server {
    listen       80;
    server_name  localhost;

    root /app;

    # Container liveness. Deliberately not proxied to the API -- this answers
    # whether nginx is serving, nothing more.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever. index.html must NOT be, or a client can keep an old document
    # that references chunks the latest deploy already deleted.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Reverse-proxy to the API container.
    #
    # The Docker DNS name is resolved per-request via a variable rather than at
    # config-parse time; with a literal proxy_pass, nginx refuses to start
    # whenever the `api` container is not already up.
    location ~ ^/api/(.*)$ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream http://api:3000;

      proxy_pass $api_upstream/$1$is_args$args;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        '';

      # telemetry.controller.ts exposes ~7 Server-Sent Events routes and the SPA
      # holds them open indefinitely. Without buffering off and a long read
      # timeout, nginx accumulates the stream and every live view appears to
      # hang. Report exports can also be slow, hence the generous send timeout.
      proxy_buffering     off;
      proxy_cache         off;
      proxy_read_timeout  24h;
      proxy_send_timeout  24h;
      chunked_transfer_encoding on;

      client_max_body_size 25m;
    }

    # SPA history-mode fallback. Must stay last so it does not shadow /api/.
    location / {
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
